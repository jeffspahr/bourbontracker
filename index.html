<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2c3e50">
    <title>Cask Watch - Rare Spirits Tracker</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.svg">
    <link rel="apple-touch-icon" href="logo-icon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #243746;
            --page-padding: 24px;
            background: #f4f6f7;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        body.debug-layout #filters * {
            outline: 1px dashed rgba(231, 76, 60, 0.6);
        }

        #header {
            background: #2c3e50;
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        #header-logo {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
        }

        #header-text {
            flex: 1;
        }

        #header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        #header p {
            font-size: 14px;
            color: #bdc3c7;
            margin-top: 5px;
        }

        #stats {
            background: #34495e;
            color: white;
            padding: 12px 24px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(220px, 1.5fr);
            gap: 12px 24px;
            font-size: 13px;
            flex-shrink: 0;
        }

        .stat {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 8px;
            min-width: 0;
        }

        .stat-label {
            color: #bdc3c7;
        }

        .stat-value {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        #filters {
            background: #f4f6f7;
            padding: 16px 24px;
            border-bottom: 1px solid #c7d0d6;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .filter-group > label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 13px;
            line-height: 1.4;
            margin: 0;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
            flex: 0 1 270px;
        }

        #product-filter-container {
            width: 100%;
            min-width: 0;
            position: relative;
        }

        #product-search {
            width: 100%;
            min-width: 0;
            padding: 10px 12px;
            min-height: 46px;
            border: 1px solid #82939e;
            border-radius: 6px;
            font: inherit;
            font-size: 16px;
            line-height: 1.4;
            color: #243746;
            background: white;
        }

        #product-search:hover {
            border-color: #3498db;
        }

        #product-search:focus {
            outline: none;
            border-color: #3498db;
        }

        #product-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            max-height: min(440px, 50dvh);
            overflow-y: auto;
            overscroll-behavior: contain;
            background: white;
            border: 1px solid #82939e;
            border-radius: 8px;
            display: none;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(36,55,70,0.18);
        }

        .dropdown-header {
            position: sticky;
            top: 0;
            background: #ecf0f1;
            padding: 8px 12px;
            border-bottom: 2px solid #bdc3c7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
        }

        .dropdown-header-text {
            font-size: 13px;
            color: #465b69;
            font-weight: 500;
        }

        .dropdown-done-btn {
            background: #236b9b;
            color: white;
            border: none;
            min-height: 44px;
            padding: 8px 14px;
            border-radius: 6px;
            font: inherit;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .dropdown-done-btn:active {
            background: #19557d;
        }

        .product-option {
            padding: 14px 12px;
            cursor: pointer;
            border-bottom: 1px solid #ecf0f1;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .product-option:hover {
            background: #ecf0f1;
        }

        .product-option:active {
            background: #d5dbdb;
        }

        .product-option:last-child {
            border-bottom: none;
        }

        .product-option input[type="checkbox"] {
            cursor: pointer;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .product-option-label {
            flex: 1;
            font-size: 15px;
            color: #2c3e50;
            line-height: 1.4;
            pointer-events: none;
        }

        #selected-products {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 112px;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 2px;
        }

        #selected-products:empty {
            display: none;
            margin-top: 0;
            min-height: 0;
        }

        .product-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 0 0 0 12px;
            max-width: 100%;
            background: #e2edf4;
            color: #174d71;
            border: 1px solid #a7c2d5;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.4;
            font-weight: 500;
        }

        .product-chip-remove {
            cursor: pointer;
            min-width: 44px;
            min-height: 44px;
            flex-shrink: 0;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: inherit;
            font-size: 22px;
        }

        .product-chip-remove:hover {
            background: #c9deeb;
        }

        #region-select, #listing-select {
            width: 100%;
            min-width: 0;
            min-height: 46px;
            padding: 10px 36px 10px 12px;
            border: 1px solid #82939e;
            border-radius: 6px;
            font: inherit;
            font-size: 16px;
            line-height: 1.4;
            color: #243746;
            background-color: white;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23465b69' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 10px 6px;
        }

        #region-select:hover, #listing-select:hover {
            border-color: #3498db;
        }

        #region-select:focus, #listing-select:focus {
            outline: none;
            border-color: #3498db;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            padding-top: 24px;
        }

        .filter-btn {
            padding: 10px 14px;
            min-height: 46px;
            border: 1px solid transparent;
            border-radius: 6px;
            font: inherit;
            font-size: 14px;
            line-height: 1.4;
            cursor: pointer;
            font-weight: 600;
        }

        .filter-btn-select {
            background: #236b9b;
            color: white;
        }

        .filter-btn-select:hover {
            background: #19557d;
        }

        .filter-btn-clear {
            background: white;
            border-color: #82939e;
            color: #34495e;
        }

        .filter-btn-clear:hover {
            background: #e2e9ed;
        }

        #map {
            position: absolute;
            inset: 0;
        }

        .info-window {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 300px;
        }

        .info-window h3 {
            color: #2c3e50;
            font-size: 16px;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .info-detail {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #ecf0f1;
            font-size: 14px;
        }

        .info-detail:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #526570;
            font-weight: 500;
        }

        .info-value {
            color: #2c3e50;
            font-weight: 600;
        }

        .quantity-high {
            color: #16713a;
        }

        .quantity-medium {
            color: #8a5600;
        }

        .quantity-low {
            color: #b33c30;
        }

        .store-link {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 13px;
            transition: background 0.3s;
        }

        .store-link:hover {
            background: #19557d;
        }

        #map-container {
            position: relative;
            flex: 1 0 320px;
            min-height: 320px;
        }

        .map-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(400px, calc(100% - 32px));
            padding: 20px;
            background: white;
            border: 1px solid #c7d0d6;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(36,55,70,0.16);
            color: #243746;
            font-size: 15px;
            line-height: 1.5;
            text-align: center;
            z-index: 2;
        }

        .map-message button { margin-top: 12px; }
        #error { border-color: #b53b32; }
        [hidden] { display: none !important; }
        #listing-filter { flex-basis: 170px; }
        #product-filter { flex: 1 1 300px; }
        .product-chip > span { overflow-wrap: anywhere; min-width: 0; }
        #product-search::placeholder { color: #5d6e79; opacity: 1; }
        .search-empty { padding: 20px 14px; color: #465b69; font-size: 14px; }
        button, select, input, a { touch-action: manipulation; }
        button:disabled { opacity: 0.55; cursor: default; }
        :focus-visible {
            outline: 3px solid #236b9b !important;
            outline-offset: 3px;
        }
        .product-option:focus-within { background: #e2edf4; }
        .product-option input { accent-color: #236b9b; }
        .product-option-label { overflow-wrap: anywhere; min-width: 0; }
        .info-window { overflow-wrap: anywhere; }
        .info-detail { gap: 16px; }
        .info-value { text-align: right; }
        .store-link { background: #236b9b; min-height: 44px; }
        .skip-link {
            position: fixed;
            top: 8px;
            left: 8px;
            padding: 12px;
            background: white;
            color: #174d71;
            transform: translateY(-150%);
            z-index: 2000;
        }
        .skip-link:focus { transform: translateY(0); }

        @media (max-width: 1100px) {
            #filters { gap: 12px; }
            .filter-buttons { padding-top: 0; width: 100%; }
        }

        @media (max-width: 768px) {
            body { --page-padding: 16px; }
            #header { padding: 12px 16px; gap: 10px; }
            #header h1 { font-size: 21px; }
            #header p { font-size: 12px; line-height: 1.4; }
            #header-logo { width: 40px; height: 40px; }
            #stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px 16px;
                padding: 12px 16px;
                font-size: 12px;
            }
            .stat { flex-direction: column; gap: 3px; }
            #filters { padding: 14px 16px; }
            .filter-group { flex: 1 1 270px; }
            #listing-filter { flex: 1 1 170px; }
            #product-filter { flex: 1 1 100%; }
            .filter-btn { flex: 1; }
            #product-dropdown { max-height: min(360px, 45dvh); }
            #selected-products { max-height: 104px; }
            #map-container { min-height: 360px; flex-basis: 360px; }
        }

        @supports (padding: env(safe-area-inset-left)) {
            #header, #stats, #filters {
                padding-left: max(var(--page-padding), env(safe-area-inset-left));
                padding-right: max(var(--page-padding), env(safe-area-inset-right));
            }
            #map-container { margin-bottom: env(safe-area-inset-bottom); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#map-container">Skip to inventory map</a>
    <div id="header">
        <img src="logo-icon.svg" alt="" width="50" height="50" id="header-logo">
        <div id="header-text">
            <h1>Cask Watch</h1>
            <p>Find rare spirits in Virginia &amp; Wake County, NC</p>
        </div>
    </div>

    <div id="stats" role="status" aria-label="Current inventory results">
        <div class="stat">
            <span class="stat-label">Bottles:</span>
            <span class="stat-value" id="total-items">-</span>
        </div>
        <div class="stat">
            <span class="stat-label">Products:</span>
            <span class="stat-value" id="unique-products">-</span>
        </div>
        <div class="stat">
            <span class="stat-label">Stores:</span>
            <span class="stat-value" id="stores-count">-</span>
        </div>
        <div class="stat">
            <span class="stat-label">Inventory updated:</span>
            <span class="stat-value" id="last-updated">-</span>
        </div>
    </div>

    <section id="filters" aria-label="Inventory filters">
        <div class="filter-group">
            <label for="region-select">Region:</label>
            <select name="region" id="region-select" onchange="filterByRegion()">
                <option value="all">All Regions</option>
                <option value="VA">Virginia (VA ABC)</option>
                <option value="NC">North Carolina (Wake)</option>
            </select>
        </div>

        <div id="listing-filter" class="filter-group" hidden>
            <label for="listing-select">Listing Type:</label>
            <select name="listing" id="listing-select" onchange="filterByListing()">
                <option value="all">All Types</option>
                <option value="Limited">Limited</option>
                <option value="Allocation">Allocation</option>
                <option value="Listed">Listed</option>
                <option value="Barrel">Barrel</option>
                <option value="Christmas">Christmas</option>
            </select>
        </div>

        <div class="filter-group" id="product-filter">
            <label for="product-search">Products:</label>
            <div id="product-filter-container">
                <input type="search" name="products" id="product-search" placeholder="Search products…" autocomplete="off" aria-controls="product-dropdown" aria-expanded="false">
                <div id="product-dropdown" role="group" aria-label="Choose products"></div>
            </div>
            <div id="selected-products" role="group" aria-label="Selected products"></div>
        </div>
        <div class="filter-buttons">
            <button class="filter-btn filter-btn-select" onclick="selectAllProducts()">Select matches</button>
            <button class="filter-btn filter-btn-clear" onclick="clearProductFilter()">Clear products</button>
        </div>
    </section>

    <main id="map-container" aria-label="Inventory map" tabindex="-1">
        <div id="map"></div>
        <div id="loading" class="map-message" role="status">Loading inventory…</div>
        <div id="error" class="map-message" role="alert" hidden>
            <p id="error-message"></p>
            <button class="filter-btn filter-btn-select" onclick="retryInventory()">Try again</button>
        </div>
        <div id="empty-results" class="map-message" role="status" hidden>
            <p>No inventory matches these filters. Try another listing type or clear your product selection.</p>
            <button class="filter-btn filter-btn-clear" onclick="resetFilters()">Reset filters</button>
        </div>
    </main>

    <script>
        let map;
        let markers = [];
        let infoWindow;
        let allInventory = [];
        let allProducts = {}; // Map of productId -> product info
        let selectedProducts = new Set();
        let selectedRegion = 'all';
        let selectedListing = 'all';
        let regionInitialized = false;
        let inventoryRequest = 0;
        let mapUnavailable = false;
        const REGION_STORAGE_KEY = 'bt-region';

        // Region centers for distance calculation
        const REGION_CENTERS = {
            'VA': { lat: 37.5407, lng: -78.4364 },
            'NC': { lat: 35.7796, lng: -78.6382 }
        };

        // Calculate distance between two points using Haversine formula
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in kilometers
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Detect user's location and set default region
        async function setDefaultRegionByLocation() {
            if (regionInitialized) {
                return;
            }

            try {
                let storedRegion = null;
                try {
                    storedRegion = localStorage.getItem(REGION_STORAGE_KEY);
                } catch (storageError) {
                    console.log('Could not read saved region:', storageError.message);
                }

                if (storedRegion === 'VA' || storedRegion === 'NC' || storedRegion === 'all') {
                    selectedRegion = storedRegion;
                    const regionSelect = document.getElementById('region-select');
                    if (regionSelect) {
                        regionSelect.value = storedRegion;
                    }
                    updateListingVisibility(selectedRegion);
                    regionInitialized = true;
                    return;
                }

                // Use ipapi.co free IP geolocation service
                const response = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(3000) });
                if (!response.ok) throw new Error('Geolocation failed');

                const data = await response.json();
                const userLat = data.latitude;
                const userLon = data.longitude;

                // Calculate distance to each region
                let closestRegion = 'all';
                let minDistance = Infinity;

                for (const [region, center] of Object.entries(REGION_CENTERS)) {
                    const distance = calculateDistance(userLat, userLon, center.lat, center.lng);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestRegion = region;
                    }
                }

                // A manual region choice made during location lookup takes precedence.
                if (regionInitialized) return;
                selectedRegion = closestRegion;
                const regionSelect = document.getElementById('region-select');
                if (regionSelect) {
                    regionSelect.value = closestRegion;
                }
                try {
                    localStorage.setItem(REGION_STORAGE_KEY, closestRegion);
                } catch (storageError) {
                    console.log('Could not save selected region:', storageError.message);
                }

                // Auto-select "Allocation" filter for NC users
                if (closestRegion === 'NC') {
                    selectedListing = 'Allocation';
                    const listingSelect = document.getElementById('listing-select');
                    if (listingSelect) {
                        listingSelect.value = 'Allocation';
                    }
                    console.log(`Auto-selected region: ${closestRegion} with Allocation filter (${minDistance.toFixed(0)}km away)`);
                } else {
                    selectedListing = 'all';
                    const listingSelect = document.getElementById('listing-select');
                    if (listingSelect) {
                        listingSelect.value = 'all';
                    }
                    console.log(`Auto-selected region: ${closestRegion} (${minDistance.toFixed(0)}km away)`);
                }
                updateListingVisibility(closestRegion);
                regionInitialized = true;
            } catch (error) {
                // Silently fail - keep default 'all' if geolocation doesn't work
                console.log('Could not detect location, showing all regions:', error.message);
                updateListingVisibility(selectedRegion);
                regionInitialized = true;
            }
        }

        function initMap() {
            // Center on Virginia
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 7,
                center: { lat: 37.5407, lng: -78.4364 },
                mapTypeControl: true,
                mapTypeControlOptions: {
                    style: google.maps.MapTypeControlStyle.DROPDOWN_MENU,
                    position: google.maps.ControlPosition.TOP_RIGHT
                },
                streetViewControl: false,
                fullscreenControl: true
            });

            infoWindow = new google.maps.InfoWindow();

            // Load inventory data
            loadInventory();
        }

        async function loadInventory() {
            const request = ++inventoryRequest;
            let loaded = false;
            document.getElementById('listing-select').disabled = true;
            document.getElementById('selected-products').hidden = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').hidden = !mapUnavailable;
            if (mapUnavailable) {
                showError('The map is temporarily unavailable. Please try again later.');
            }
            document.getElementById('empty-results').hidden = true;
            document.getElementById('product-search').disabled = true;
            document.querySelectorAll('.filter-buttons button').forEach(button => button.disabled = true);
            closeDropdown();
            if (infoWindow) infoWindow.close();
            // Do not show the previous region's stock while fetching its replacement.
            markers.forEach(marker => marker.setMap(null));
            markers = [];
            allInventory = [];
            updateStats([]);
            try {
                // Set default region based on user's location first
                await setDefaultRegionByLocation();
                if (request !== inventoryRequest) return;

                // Load inventory based on selected region
                let inventory = [];

                if (selectedRegion === 'all') {
                    // Load both VA and NC inventories
                    const [vaResponse, ncResponse] = await Promise.all([
                        fetch('inventory-va.json'),
                        fetch('inventory-nc.json')
                    ]);

                    if (!vaResponse.ok && !ncResponse.ok) {
                        throw new Error('Failed to load inventory files');
                    }

                    const vaInventory = vaResponse.ok ? await vaResponse.json() : [];
                    const ncInventory = ncResponse.ok ? await ncResponse.json() : [];

                    inventory = [...vaInventory, ...ncInventory];
                } else if (selectedRegion === 'VA') {
                    const response = await fetch('inventory-va.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    inventory = await response.json();
                } else if (selectedRegion === 'NC') {
                    const response = await fetch('inventory-nc.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    inventory = await response.json();
                }

                if (request !== inventoryRequest) return;
                allInventory = inventory;
                populateProductSelector(inventory);
                // Keep only selections that exist in the newly loaded region.
                selectedProducts = new Set([...selectedProducts].filter(id => allProducts[id]));
                updateSelectedProductsDisplay();
                applyFilters();
                loaded = true;
            } catch (error) {
                if (request !== inventoryRequest) return;
                console.error('Error loading inventory:', error);
                showError('Inventory could not be loaded. Try again or choose another region.');
            } finally {
                if (request === inventoryRequest) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('product-search').disabled = !loaded;
                    document.getElementById('listing-select').disabled = !loaded;
                    document.getElementById('selected-products').hidden = !loaded;
                    document.querySelectorAll('.filter-buttons button').forEach(button => button.disabled = !loaded);
                }
            }
        }

        function retryInventory() {
            if (map && !mapUnavailable) loadInventory();
            else window.location.reload();
        }

        function resetFilters() {
            selectedListing = 'all';
            document.getElementById('listing-select').value = 'all';
            updateProductList();
            clearProductFilter();
        }

        function populateProductSelector(inventory) {
            // Calculate products from ALL inventory (unfiltered)
            const products = {};
            inventory.forEach(item => {
                const productId = item['bt.productId'];
                const productName = item['bt.productName'];
                if (!products[productId]) {
                    products[productId] = { name: productName, count: 0, quantity: 0 };
                }
                products[productId].count++;
                products[productId].quantity += item['bt.quantity'];
            });

            // Store globally
            allProducts = products;

            // Set up search input (only once)
            const searchInput = document.getElementById('product-search');
            if (!searchInput.hasAttribute('data-initialized')) {
                searchInput.addEventListener('input', handleProductSearch);
                searchInput.addEventListener('click', handleProductSearch);
                searchInput.addEventListener('keydown', (event) => {
                    if (event.key === 'ArrowDown') {
                        event.preventDefault();
                        handleProductSearch({ target: searchInput });
                        const firstOption = document.querySelector('#product-dropdown input')
                            || document.querySelector('#product-dropdown button');
                        firstOption?.focus();
                    }
                });
                document.getElementById('product-filter-container').addEventListener('focusout', (event) => {
                    if (!event.currentTarget.contains(event.relatedTarget)) closeDropdown();
                });
                searchInput.setAttribute('data-initialized', 'true');

                // Close dropdown when clicking outside or pressing Escape
                document.addEventListener('click', (e) => {
                    const dropdown = document.getElementById('product-dropdown');
                    const container = document.getElementById('product-filter-container');

                    if (!container.contains(e.target) && dropdown.style.display === 'block') {
                        closeDropdown();
                    }
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        closeDropdown(true);
                    }
                });
            }

            // Update product list based on current filters
            updateProductList();
        }

        function updateProductList() {
            // Get filtered inventory based on region and listing type (but NOT product filter)
            let filtered = allInventory;

            if (selectedRegion !== 'all') {
                filtered = filtered.filter(item =>
                    item['bt.state'] === selectedRegion
                );
            }

            if (selectedListing !== 'all' && selectedRegion === 'NC') {
                filtered = filtered.filter(item =>
                    item['bt.listingType'] === selectedListing
                );
            }

            // Calculate products from filtered inventory
            const filteredProducts = {};
            filtered.forEach(item => {
                const productId = item['bt.productId'];
                const productName = item['bt.productName'];
                if (!filteredProducts[productId]) {
                    filteredProducts[productId] = { name: productName, count: 0, quantity: 0 };
                }
                filteredProducts[productId].count++;
                filteredProducts[productId].quantity += item['bt.quantity'];
            });

            // Store filtered products globally for search
            window.filteredProducts = filteredProducts;

            // Update placeholder
            const searchInput = document.getElementById('product-search');
            const productCount = Object.keys(filteredProducts).length;
            searchInput.placeholder = `Search ${productCount} product${productCount !== 1 ? 's' : ''}…`;

            // Refresh the dropdown if it's open
            if (document.getElementById('product-dropdown').style.display === 'block') {
                handleProductSearch({ target: searchInput });
            }
        }

        function closeDropdown(restoreFocus = false) {
            const dropdown = document.getElementById('product-dropdown');
            const search = document.getElementById('product-search');
            if (restoreFocus && dropdown.contains(document.activeElement)) search.focus();
            dropdown.style.display = 'none';
            search.setAttribute('aria-expanded', 'false');
        }

        function handleProductSearch(e) {
            const searchText = e.target.value.toLowerCase();
            const dropdown = document.getElementById('product-dropdown');

            // Use filteredProducts (based on region/listing filters) instead of allProducts
            const productsToSearch = window.filteredProducts || allProducts;

            // Filter products based on search text
            const filtered = Object.entries(productsToSearch).filter(([productId, info]) => {
                const searchableText = `${info.name} ${productId}`.toLowerCase();
                return searchableText.includes(searchText);
            });

            // Sort by quantity (most popular first)
            filtered.sort((a, b) => b[1].quantity - a[1].quantity);

            // Keep the panel open for empty searches so there is useful feedback.
            dropdown.innerHTML = '';

            // Add header with done button
            const header = document.createElement('div');
            header.className = 'dropdown-header';

            const headerText = document.createElement('span');
            headerText.className = 'dropdown-header-text';
            headerText.textContent = `Select products (${selectedProducts.size} selected)`;

            const doneBtn = document.createElement('button');
            doneBtn.className = 'dropdown-done-btn';
            doneBtn.textContent = 'Done';
            doneBtn.onclick = (e) => {
                e.stopPropagation();
                closeDropdown(true);
            };

            header.appendChild(headerText);
            header.appendChild(doneBtn);
            dropdown.appendChild(header);

            // Add product options
            filtered.forEach(([productId, info]) => {
                const option = document.createElement('label');
                option.className = 'product-option';
                option.dataset.productId = productId;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = selectedProducts.has(productId);
                checkbox.onchange = () => {
                    toggleProduct(productId);
                };

                const label = document.createElement('span');
                label.className = 'product-option-label';
                label.textContent = `${info.name} (${info.quantity} bottle${info.quantity !== 1 ? 's' : ''} at ${info.count} location${info.count !== 1 ? 's' : ''})`;

                option.appendChild(checkbox);
                option.appendChild(label);

                dropdown.appendChild(option);
            });
            if (filtered.length === 0) {
                const empty = document.createElement('p');
                empty.className = 'search-empty';
                empty.setAttribute('role', 'status');
                empty.textContent = 'No matching products. Try another name or product ID.';
                dropdown.appendChild(empty);
            }
            dropdown.style.display = 'block';
            document.getElementById('product-search').setAttribute('aria-expanded', 'true');
        }

        function toggleProduct(productId) {
            if (selectedProducts.has(productId)) {
                selectedProducts.delete(productId);
            } else {
                selectedProducts.add(productId);
            }
            updateSelectedProductsDisplay();

            // Update the count in the dropdown header if it exists
            const dropdown = document.getElementById('product-dropdown');
            const headerText = dropdown.querySelector('.dropdown-header-text');
            if (headerText) {
                headerText.textContent = `Select products (${selectedProducts.size} selected)`;
            }

            // Update checkbox state in the dropdown
            const option = Array.from(dropdown.querySelectorAll('.product-option'))
                .find(option => option.dataset.productId === productId);
            if (option) {
                const checkbox = option.querySelector('input[type="checkbox"]');
                if (checkbox) {
                    checkbox.checked = selectedProducts.has(productId);
                }
            }

            applyFilters();
        }

        function updateSelectedProductsDisplay() {
            const container = document.getElementById('selected-products');
            container.innerHTML = '';

            if (selectedProducts.size === 0) {
                return;
            }

            selectedProducts.forEach(productId => {
                const info = allProducts[productId];
                if (!info) return;
                const chip = document.createElement('div');
                chip.className = 'product-chip';

                const name = document.createElement('span');
                name.textContent = info.name;

                const remove = document.createElement('button');
                remove.type = 'button';
                remove.setAttribute('aria-label', `Remove ${info.name}`);
                remove.className = 'product-chip-remove';
                remove.textContent = '×';
                remove.onclick = () => {
                    toggleProduct(productId);
                    const nextRemove = container.querySelector('button');
                    (nextRemove || document.getElementById('product-search')).focus();
                };

                chip.appendChild(name);
                chip.appendChild(remove);
                container.appendChild(chip);
            });
        }

        async function filterByRegion() {
            const select = document.getElementById('region-select');
            const newRegion = select.value;

            // If changing to a different region, reload inventory
            if (newRegion !== selectedRegion) {
                selectedRegion = newRegion;
                regionInitialized = true;
                document.getElementById('product-search').value = '';
                try {
                    localStorage.setItem(REGION_STORAGE_KEY, newRegion);
                } catch (storageError) {
                    console.log('Could not save selected region:', storageError.message);
                }
                selectedListing = 'all';
                const listingSelect = document.getElementById('listing-select');
                if (listingSelect) {
                    listingSelect.value = 'all';
                }
                updateListingVisibility(newRegion);
                document.getElementById('loading').style.display = 'block';
                await loadInventory();
            }
        }

        function updateListingVisibility(region) {
            const listingFilter = document.getElementById('listing-filter');
            if (!listingFilter) {
                return;
            }
            listingFilter.hidden = region !== 'NC';
        }

        function filterByListing() {
            const select = document.getElementById('listing-select');
            selectedListing = select.value;
            updateProductList(); // Update available products based on listing type
            applyFilters();
        }

        function applyFilters() {
            let filtered = allInventory;

            // Filter by region
            if (selectedRegion !== 'all') {
                filtered = filtered.filter(item =>
                    item['bt.state'] === selectedRegion
                );
            }

            // Filter by listing type
            if (selectedListing !== 'all') {
                filtered = filtered.filter(item =>
                    item['bt.listingType'] === selectedListing
                );
            }

            // Filter by product
            if (selectedProducts.size > 0) {
                filtered = filtered.filter(item =>
                    selectedProducts.has(item['bt.productId'])
                );
            }

            displayInventory(filtered);
            updateStats(filtered);
            document.getElementById('empty-results').hidden = filtered.length > 0
                || !document.getElementById('error').hidden;
        }

        function selectAllProducts() {
            const searchText = document.getElementById('product-search').value.toLowerCase();

            // Use filteredProducts (based on region/listing filters)
            const productsToSearch = window.filteredProducts || allProducts;

            // Get filtered products based on current search
            const filtered = Object.entries(productsToSearch).filter(([productId, info]) => {
                const searchableText = `${info.name} ${productId}`.toLowerCase();
                return searchableText.includes(searchText);
            });

            // Add all filtered products to selection
            filtered.forEach(([productId]) => {
                selectedProducts.add(productId);
            });

            updateSelectedProductsDisplay();
            handleProductSearch({ target: document.getElementById('product-search') });
            applyFilters();
        }

        function clearProductFilter() {
            selectedProducts.clear();
            document.getElementById('product-search').value = '';
            closeDropdown();
            updateSelectedProductsDisplay();
            applyFilters();
        }

        function displayInventory(inventory) {
            if (!map) return;
            if (infoWindow) infoWindow.close();
            // Clear existing markers
            markers.forEach(marker => marker.setMap(null));
            markers = [];

            // Group inventory by store location
            const storeGroups = {};

            inventory.forEach(item => {
                const lat = item['geo.location'].lat;
                const lon = item['geo.location'].lon;
                const key = `${lat},${lon}`;

                if (!storeGroups[key]) {
                    storeGroups[key] = {
                        lat: lat,
                        lon: lon,
                        storeId: item['bt.storeId'],
                        state: item['bt.state'],
                        county: item['bt.county'],
                        items: []
                    };
                }
                storeGroups[key].items.push(item);
            });

            // Create markers
            Object.values(storeGroups).forEach(store => {
                const totalQuantity = store.items.reduce((sum, item) => sum + item['bt.quantity'], 0);

                // Marker color based on total quantity
                let markerColor = 'red';
                if (totalQuantity > 10) markerColor = 'green';
                else if (totalQuantity > 5) markerColor = 'orange';

                const marker = new google.maps.Marker({
                    position: { lat: store.lat, lng: store.lon },
                    map: map,
                    title: `Store ${store.storeId} - ${store.items.length} product(s)`,
                    icon: `https://maps.google.com/mapfiles/ms/icons/${markerColor}-dot.png`
                });

                marker.addListener('click', () => {
                    showInfoWindow(marker, store);
                });

                markers.push(marker);
            });

            // Fit map to markers
            if (markers.length > 0) {
                const bounds = new google.maps.LatLngBounds();
                markers.forEach(marker => bounds.extend(marker.getPosition()));
                map.fitBounds(bounds);
            }
        }

        function showInfoWindow(marker, store) {
            let content = `<div class="info-window">`;
            content += `<h3>Store #${store.storeId}</h3>`;

            // Show state/county for NC stores
            if (store.state === 'NC' && store.county) {
                content += `<p style="color: #526570; font-size: 14px; margin: 5px 0 15px 0;">${store.county} County, ${store.state}</p>`;
            }

            store.items.forEach(item => {
                const quantityClass = item['bt.quantity'] > 5 ? 'quantity-high' :
                                     item['bt.quantity'] > 2 ? 'quantity-medium' : 'quantity-low';

                content += `
                    <div style="margin: 15px 0; padding: 10px 0; border-top: 2px solid #ecf0f1;">
                        <div style="font-weight: 600; color: #2c3e50; margin-bottom: 8px;">${item['bt.productName']}</div>
                        <div class="info-detail">
                            <span class="info-label">Quantity:</span>
                            <span class="info-value ${quantityClass}">${item['bt.quantity']}</span>
                        </div>
                        <div class="info-detail">
                            <span class="info-label">Product ID:</span>
                            <span class="info-value">${item['bt.productId']}</span>
                        </div>
                        <a href="${item['bt.storeurl']}" target="_blank" rel="noopener noreferrer" class="store-link">View on ABC Website</a>
                    </div>
                `;
            });

            content += `</div>`;

            infoWindow.setContent(content);
            infoWindow.open(map, marker);
        }

        function updateStats(inventory) {
            const totalItems = inventory.reduce((sum, item) => sum + item['bt.quantity'], 0);
            const uniqueProducts = new Set(inventory.map(item => item['bt.productId'])).size;
            const uniqueStores = new Set(inventory.map(item => `${item['bt.state']}:${item['bt.storeId']}`)).size;
            // Freshness describes the loaded data even when the current filters match nothing.
            const latestTimestamp = allInventory.reduce((latest, item) => {
                const timestamp = new Date(item['@timestamp']).getTime();
                return Number.isFinite(timestamp) ? Math.max(latest, timestamp) : latest;
            }, -Infinity);
            const lastUpdated = document.getElementById('last-updated');
            document.getElementById('total-items').textContent = totalItems.toLocaleString();
            document.getElementById('unique-products').textContent = uniqueProducts.toLocaleString();
            document.getElementById('stores-count').textContent = uniqueStores.toLocaleString();
            lastUpdated.textContent = Number.isFinite(latestTimestamp)
                ? new Intl.DateTimeFormat(undefined, { dateStyle: 'short', timeStyle: 'short' }).format(latestTimestamp)
                : 'Not available';
        }

        function showError(message) {
            document.getElementById('error-message').textContent = message;
            document.getElementById('error').hidden = false;
            document.getElementById('empty-results').hidden = true;
        }

        (function initDebugLayout() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('debug') === '1') {
                document.body.classList.add('debug-layout');
            }
        })();

        // Load Google Maps API dynamically after config is loaded
        function loadGoogleMaps() {
            if (typeof GOOGLE_MAPS_API_KEY === 'undefined' || GOOGLE_MAPS_API_KEY === 'YOUR_API_KEY_HERE') {
                showError('The map is not configured yet. Please try again later.');
                document.getElementById('loading').style.display = 'none';
                return;
            }

            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=initMap&loading=async`;
            script.async = true;
            script.defer = true;
            window.gm_authFailure = function() {
                mapUnavailable = true;
                showError('The map is temporarily unavailable. Please try again later.');
                document.getElementById('loading').style.display = 'none';
            };
            script.onerror = function() {
                showError('The map could not be loaded. Check your connection and try again.');
                document.getElementById('loading').style.display = 'none';
            };
            document.head.appendChild(script);
        }
    </script>

    <!-- Load API key configuration -->
    <script src="config.js" onload="loadGoogleMaps()" onerror="showError('The map could not be loaded. Please try again later.'); document.getElementById('loading').style.display = 'none';"></script>
</body>
</html>
